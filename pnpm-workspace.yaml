packages:
  - packages/*

allowBuilds:
  core-js: false
  edgedriver: false
  esbuild: true
  geckodriver: false

linkWorkspacePackages: true

overrides:
  serialize-javascript: ^7.0.3
  source-map-js: ^1.2.2
  tinypool: ^2.1.2

minimumReleaseAgeExclude:
  - three
  - '@tanstack/charts'
  - tanstack-router-ga4
  - yargs-file-commands
  - '@vitest/browser-playwright'
  - '@vitest/browser'
  - '@vitest/coverage-v8'
  - '@vitest/mocker'
  - '@vitest/pretty-format'
  - '@vitest/spy'
  - '@vitest/ui'
  - '@vitest/utils'
  - vitest
