name: Release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode (no publish, no tag, no GitHub release).
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  guard:
    name: Validate ref
    runs-on: ubuntu-latest
    steps:
      - name: Reject dispatches not targeting main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::release.yml may only be dispatched against refs/heads/main (got ${{ github.ref }})."
            exit 1
          fi
  checks:
    needs: guard
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
    with:
      # The separate main CI run already executes the advisory GPU suite.
      # Publish after required gates, without duplicating that slow suite.
      skip-gpu: true
  release:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Confirm main has not advanced since this dispatch was validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api repos/${{ github.repository }}/git/refs/heads/main --jq .object.sha)
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "::error::main advanced after this dispatch was validated (dispatched ${{ github.sha }}, now $current). Re-run the workflow to validate and release the new tip."
            exit 1
          fi
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      # Node 26 ships npm with OIDC support. Do not configure registry-url or NPM_TOKEN.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Restore generated changelog from the previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0)
          if [ "$tag" != "v0.1.0" ]; then
            gh release download "$tag" --pattern CHANGELOG.md --clobber
          fi
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm release --dry-run | tee "$GITHUB_STEP_SUMMARY"
          else
            pnpm release | tee "$GITHUB_STEP_SUMMARY"
          fi
